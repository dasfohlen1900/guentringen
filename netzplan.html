<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GÜN Netzplan Juni</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@700;800;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0b0e14;font-family:'DM Sans',sans-serif;}

/* ── HEADER ── */
header{
  position:fixed;top:0;left:0;right:0;z-index:100;
  height:52px;
  background:rgba(11,14,20,.92);
  backdrop-filter:blur(12px);
  border-bottom:1px solid #1e2530;
  display:flex;align-items:center;gap:14px;padding:0 16px;
}
.hdr-logo{
  font-family:'Barlow',sans-serif;font-size:20px;font-weight:900;
  color:#fff;letter-spacing:.5px;flex-shrink:0;
}
.hdr-logo span{color:#ff0022;}
.hdr-sub{font-size:11px;color:#5a6580;letter-spacing:.5px;font-family:'DM Sans',sans-serif;}
.hdr-spacer{flex:1;}
.hdr-controls{display:flex;gap:6px;align-items:center;}
.ctrl-btn{
  padding:5px 11px;border-radius:7px;border:1px solid #252d3a;
  background:rgba(255,255,255,.04);color:#8a9ab8;font-size:11px;font-weight:700;
  cursor:pointer;font-family:'DM Sans',sans-serif;transition:.12s;
}
.ctrl-btn:hover{background:rgba(255,255,255,.09);color:#dde4f0;}
.ctrl-btn.active{background:rgba(255,255,255,.12);color:#fff;border-color:#404860;}

/* ── LEGEND ── */
#legend{
  position:fixed;bottom:16px;left:16px;z-index:100;
  background:rgba(11,14,20,.9);backdrop-filter:blur(10px);
  border:1px solid #1e2530;border-radius:12px;padding:12px 14px;
  min-width:180px;max-width:220px;
}
.leg-title{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  color:#5a6580;margin-bottom:8px;}
.leg-item{display:flex;align-items:center;gap:8px;margin-bottom:5px;cursor:pointer;
  padding:3px 5px;border-radius:5px;transition:.12s;}
.leg-item:hover{background:rgba(255,255,255,.05);}
.leg-item.dimmed{opacity:.3;}
.leg-swatch{width:20px;height:4px;border-radius:2px;flex-shrink:0;}
.leg-swatch.dashed{background:repeating-linear-gradient(90deg,currentColor 0,currentColor 4px,transparent 4px,transparent 8px);}
.leg-name{font-size:11px;font-weight:700;color:#c8d4e8;}

/* ── TOOLTIP ── */
#tooltip{
  position:fixed;z-index:200;pointer-events:none;
  background:rgba(11,14,20,.95);backdrop-filter:blur(12px);
  border:1px solid #252d3a;border-radius:10px;
  padding:10px 14px;min-width:160px;max-width:240px;
  transform:translate(-50%,-100%);margin-top:-10px;
  opacity:0;transition:opacity .15s;
}
#tooltip.show{opacity:1;}
.tt-name{font-family:'Barlow',sans-serif;font-size:15px;font-weight:900;
  color:#fff;text-transform:uppercase;margin-bottom:5px;}
.tt-lines{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px;}
.tt-badge{padding:2px 8px;border-radius:4px;font-size:10px;font-weight:800;color:#fff;}
.tt-type{font-size:10px;color:#5a6580;letter-spacing:.5px;}

/* ── CANVAS WRAP ── */
#map-wrap{
  position:fixed;inset:0;top:52px;
  cursor:grab;overflow:hidden;touch-action:none;
}
#map-wrap:active{cursor:grabbing;}
#map-svg{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform;}

/* ── ZOOM BADGE ── */
#zoom-badge{
  position:fixed;bottom:16px;right:16px;z-index:100;
  background:rgba(11,14,20,.8);border:1px solid #252d3a;border-radius:8px;
  padding:5px 10px;font-family:'DM Mono',monospace;font-size:11px;color:#5a6580;
}

/* ── STATION POPUP (bottom sheet) ── */
#stn-sheet{
  position:fixed;bottom:0;left:0;right:0;z-index:300;
  background:#13181f;border-radius:18px 18px 0 0;
  border-top:1px solid #252d3a;
  padding:16px 20px 32px;
  transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);
  box-shadow:0 -8px 40px rgba(0,0,0,.6);
}
#stn-sheet.open{transform:translateY(0);}
.sheet-handle{width:36px;height:4px;background:#252d3a;border-radius:2px;margin:0 auto 14px;}
.sheet-name{font-family:'Barlow',sans-serif;font-size:22px;font-weight:900;
  text-transform:uppercase;color:#fff;margin-bottom:6px;}
.sheet-lines{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px;}
.sheet-badge{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:800;color:#fff;}
.sheet-info{font-size:12px;color:#5a6580;letter-spacing:.3px;}
#sheet-backdrop{position:fixed;inset:0;z-index:299;display:none;}
#sheet-backdrop.open{display:block;}
</style>
</head>
<body>

<header>
  <div class="hdr-logo">GÜN<span>.</span></div>
  <div class="hdr-sub">Netzplan Juni</div>
  <div class="hdr-spacer"></div>
  <div class="hdr-controls">

    <button class="ctrl-btn active" id="btn-labels" onclick="toggleLabels()">Labels</button>
    <button class="ctrl-btn" id="btn-depots" onclick="toggleDepots()">Depots</button>
  </div>
</header>

<div id="map-wrap">

</div>

<div id="legend">
  <div class="leg-title">Legende</div>
  <div id="leg-items"></div>
</div>

<div id="zoom-badge">100%</div>
<div id="tooltip"><div class="tt-name" id="tt-name"></div><div class="tt-lines" id="tt-lines"></div><div class="tt-type" id="tt-type"></div></div>

<div id="sheet-backdrop" onclick="closeSheet()"></div>
<div id="stn-sheet">

  <div class="sheet-name" id="sheet-name"></div>
  <div class="sheet-lines" id="sheet-lines"></div>
  <div class="sheet-info" id="sheet-info"></div>

const EDGES = [

  {a:30,b:79,line:1},{a:79,b:29,line:1},{a:29,b:28,line:1},{a:28,b:102,line:1},{a:102,b:16,line:1},{a:16,b:27,line:1},

  {a:44,b:43,line:2},{a:45,b:12,line:2},{a:45,b:44,line:2},{a:31,b:62,line:2},
  {a:3, b:36,line:3},{a:36,b:41,line:3},{a:41,b:37,line:3},{a:37,b:40,line:3},{a:38,b:40,line:3},
  {a:38,b:39,line:3},{a:39,b:42,line:3},{a:42,b:43,line:3},
  {a:6, b:50,line:4},{a:50,b:2, line:4},{a:1, b:2, line:4},{a:1, b:9, line:4},{a:1, b:51,line:4},
  {a:51,b:11,line:4},{a:11,b:52,line:4},
  {a:46,b:36,line:5},{a:36,b:2, line:5},{a:46,b:47,line:5},{a:47,b:22,line:5},{a:22,b:48,line:5},
  {a:48,b:49,line:5},

  {a:85,b:86,line:16},{a:86,b:87,line:16},{a:87,b:88,line:16},{a:88,b:89,line:16},{a:89,b:90,line:16},
  {a:90,b:91,line:16},{a:91,b:92,line:16},{a:92,b:93,line:16},{a:93,b:94,line:16},{a:94,b:95,line:16},
  {a:95,b:96,line:16},{a:96,b:97,line:16},{a:97,b:66,line:16},{a:66,b:53,line:16},{a:53,b:52,line:16},
  {a:52,b:11,line:16},{a:11,b:10,line:16},{a:10,b:9, line:16},{a:9, b:1, line:16},{a:1, b:2, line:16},
];

/* ══════════════════════════════════════════════════════
   SETUP
══════════════════════════════════════════════════════ */
const stnById = {};
STATIONS.forEach(s => stnById[s.id] = s);

// Compute bounding box
let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
STATIONS.forEach(s => {
  if(minX>s.x)minX=s.x; if(minY>s.y)minY=s.y;
  if(maxX<s.x)maxX=s.x; if(maxY<s.y)maxY=s.y;
});
const PAD = 120;
const SVG_W = maxX - minX + PAD*2;
const SVG_H = maxY - minY + PAD*2;
const OX = PAD - minX; // offset so all coords positive
const OY = PAD - minY;
const SCALE = 1; // base scale (1px per JSON unit)

const svg = document.getElementById('map-svg');
svg.setAttribute('width', SVG_W);
svg.setAttribute('height', SVG_H);

// State
let tx=0, ty=0, sc=1;
let showLabels = true, showDepots = false;
let dimmedLines = new Set();
let activeLine = null;

/* ══════════════════════════════════════════════════════
   RENDER
══════════════════════════════════════════════════════ */
function px(x){ return (x + OX) * SCALE; }
function py(y){ return (y + OY) * SCALE; }

// Offset edges per line to avoid exact overlap
const LINE_OFFSETS = {};
const edgeGrouped = {};
EDGES.forEach(e => {
  const key = [Math.min(e.a,e.b), Math.max(e.a,e.b)].join('-');
  if(!edgeGrouped[key]) edgeGrouped[key] = [];
  edgeGrouped[key].push(e.line);
});
Object.entries(edgeGrouped).forEach(([key, lines]) => {
  lines.forEach((lid, i) => {
    const offset = (i - (lines.length-1)/2) * 3.5;
    if(!LINE_OFFSETS[lid]) LINE_OFFSETS[lid] = {};
    LINE_OFFSETS[lid][key] = offset;
  });
});

function getOffset(lid, a, b) {
  const key = [Math.min(a,b),Math.max(a,b)].join('-');
  return (LINE_OFFSETS[lid] && LINE_OFFSETS[lid][key]) || 0;
}

function perpOffset(ax, ay, bx, by, d) {
  const dx = bx-ax, dy = by-ay, len = Math.sqrt(dx*dx+dy*dy)||1;
  return { ox: -dy/len * d, oy: dx/len * d };
}

function buildSVG() {
  svg.innerHTML = '';

  // ── DARK BACKGROUND ──
  const bg = document.createElementNS('http://www.w3.org/2000/svg','rect');
  bg.setAttribute('width', SVG_W); bg.setAttribute('height', SVG_H);
  bg.setAttribute('fill','#0b0e14');
  svg.appendChild(bg);

  // ── SUBTLE GRID ──
  const grid = document.createElementNS('http://www.w3.org/2000/svg','g');
  grid.setAttribute('opacity','.04');
  for(let gx=0;gx<SVG_W;gx+=80){
    const l=document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('x1',gx);l.setAttribute('y1',0);l.setAttribute('x2',gx);l.setAttribute('y2',SVG_H);
    l.setAttribute('stroke','#fff');l.setAttribute('stroke-width','1');grid.appendChild(l);
  }
  for(let gy=0;gy<SVG_H;gy+=80){
    const l=document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('x1',0);l.setAttribute('y1',gy);l.setAttribute('x2',SVG_W);l.setAttribute('y2',gy);
    l.setAttribute('stroke','#fff');l.setAttribute('stroke-width','1');grid.appendChild(l);
  }
  svg.appendChild(grid);

  // ── EDGES ──
  const edgeGroup = document.createElementNS('http://www.w3.org/2000/svg','g');
  edgeGroup.setAttribute('id','edges');

  // Draw in line order: depots first, then normal
  const ORDER = [2,6, 0,1,3,4,5,7,8,9,10,11,12,13,14,15];
  ORDER.forEach(lid => {
    const line = LINES[lid];
    const isDashed = line.style === 'dashed';
    const isDepot = lid === 2 || lid === 6;
    const opacity = dimmedLines.has(lid) ? 0.06 : (isDepot ? 0.45 : 1);
    const strokeW = isDepot ? 2 : (lid === 4 ? 4 : lid === 11 ? 3.8 : 3.2); // OctoSpeed & S22 thicker

    EDGES.filter(e=>e.line===lid).forEach(e => {
      const sa = stnById[e.a], sb = stnById[e.b];
      if(!sa||!sb) return;
      if(!showDepots && (sa.type==='depot'||sb.type==='depot')) return;

      const ax=px(sa.x), ay=py(sa.y), bx=px(sb.x), by=py(sb.y);
      const off = getOffset(lid, e.a, e.b);
      const {ox,oy} = perpOffset(ax,ay,bx,by,off);

      const path = document.createElementNS('http://www.w3.org/2000/svg','line');
      path.setAttribute('x1', ax+ox); path.setAttribute('y1', ay+oy);
      path.setAttribute('x2', bx+ox); path.setAttribute('y2', by+oy);
      path.setAttribute('stroke', line.color);
      path.setAttribute('stroke-width', strokeW);
      path.setAttribute('stroke-linecap','round');
      path.setAttribute('opacity', opacity);
      if(isDashed) path.setAttribute('stroke-dasharray','14 8');
      edgeGroup.appendChild(path);
    });
  });
  svg.appendChild(edgeGroup);

  // ── STATIONS ──
  const stnGroup = document.createElementNS('http://www.w3.org/2000/svg','g');
  stnGroup.setAttribute('id','stations');

  STATIONS.forEach(s => {
    if(!showDepots && s.type==='depot') return;

    const cx = px(s.x), cy = py(s.y);
    const isInterchange = s.type==='interchange' || s.lines.length > 2;
    const isTerminus    = s.type==='terminus';
    const isDepot       = s.type==='depot';
    const isHbf         = s.name.includes('Hbf') || s.name.includes('Dreieck') || s.name.includes('Terminal');

    // Station circle/diamond
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.style.cursor = 'pointer';

    // Glow for interchanges
    if(isInterchange || isHbf) {
      const glow = document.createElementNS('http://www.w3.org/2000/svg','circle');
      glow.setAttribute('cx', cx); glow.setAttribute('cy', cy);
      glow.setAttribute('r', 14);
      glow.setAttribute('fill', managerColor(s));
      glow.setAttribute('opacity', '.18');
      g.appendChild(glow);
    }

    // Outer ring
    const r = isInterchange ? 9 : isTerminus ? 7 : isDepot ? 4 : 6;
    const outer = document.createElementNS('http://www.w3.org/2000/svg','circle');
    outer.setAttribute('cx', cx); outer.setAttribute('cy', cy); outer.setAttribute('r', r);
    outer.setAttribute('fill', isDepot ? '#2a3040' : '#0b0e14');
    outer.setAttribute('stroke', isDepot ? '#3a4555' : '#fff');
    outer.setAttribute('stroke-width', isDepot ? 1 : isInterchange ? 2.5 : 2);
    g.appendChild(outer);

    // Inner colour fill — Farbe des Managers
    if(!isDepot) {
      const inner = document.createElementNS('http://www.w3.org/2000/svg','circle');
      inner.setAttribute('cx', cx); inner.setAttribute('cy', cy);
      inner.setAttribute('r', r - 2.5);
      inner.setAttribute('fill', managerColor(s));
      g.appendChild(inner);
    }

    // Station label
    if(showLabels) {
      const lbl = document.createElementNS('http://www.w3.org/2000/svg','text');
      const lblOff = r + 5;
      lbl.setAttribute('x', cx);
      lbl.setAttribute('y', cy - lblOff);
      lbl.setAttribute('text-anchor','middle');
      lbl.setAttribute('dominant-baseline','auto');
      lbl.setAttribute('font-family',"'Barlow Condensed',sans-serif");
      lbl.setAttribute('font-size', isInterchange || isHbf ? '11' : isDepot ? '8' : '10');
      lbl.setAttribute('font-weight', isInterchange || isHbf ? '800' : '700');
      lbl.setAttribute('fill', isDepot ? '#3a4555' : isInterchange ? '#fff' : '#c8d4e8');
      lbl.setAttribute('paint-order','stroke');
      lbl.setAttribute('stroke','#0b0e14');
      lbl.setAttribute('stroke-width','3');
      lbl.setAttribute('stroke-linejoin','round');
      // Wrap long names
      const words = s.name.split(' ');
      if(words.length > 2 && !isDepot) {
        const mid = Math.ceil(words.length/2);
        const tspan1 = document.createElementNS('http://www.w3.org/2000/svg','tspan');
        tspan1.setAttribute('x',cx); tspan1.setAttribute('dy','0');
        tspan1.textContent = words.slice(0,mid).join(' ');
        const tspan2 = document.createElementNS('http://www.w3.org/2000/svg','tspan');
        tspan2.setAttribute('x',cx); tspan2.setAttribute('dy','-12');
        tspan2.textContent = words.slice(mid).join(' ');
        lbl.appendChild(tspan2);
        lbl.appendChild(tspan1);
        lbl.setAttribute('y', cy - lblOff + 6);
      } else {
        lbl.textContent = s.name;
      }
      g.appendChild(lbl);
    }

    // Invisible hit target
    const hit = document.createElementNS('http://www.w3.org/2000/svg','circle');
    hit.setAttribute('cx',cx); hit.setAttribute('cy',cy); hit.setAttribute('r',14);
    hit.setAttribute('fill','transparent');
    hit.addEventListener('mouseenter', e => showTooltip(s, e));
    hit.addEventListener('mouseleave', hideTooltip);
    hit.addEventListener('click', () => openSheet(s));
    g.appendChild(hit);

    stnGroup.appendChild(g);
  });
  svg.appendChild(stnGroup);
}

/* ══════════════════════════════════════════════════════
   LEGEND
══════════════════════════════════════════════════════ */
function buildLegend() {
  const container = document.getElementById('leg-items');
  container.innerHTML = '';
  // Only show non-depot lines
  const show = LINES.filter(l => l.id !== 2);
  show.forEach(line => {
    const item = document.createElement('div');
    item.className = 'leg-item';
    item.dataset.lid = line.id;
    item.innerHTML = `
      <div class="leg-swatch${line.style==='dashed'?' dashed':''}"
           style="background:${line.style==='dashed'?'transparent':line.color};
                  ${line.style==='dashed'?`color:${line.color}`:''}"></div>
      <div class="leg-name">${line.name}</div>`;
    item.addEventListener('click', () => toggleLine(line.id, item));
    container.appendChild(item);
  });
}

function toggleLine(lid, el) {
  if(dimmedLines.has(lid)) { dimmedLines.delete(lid); el.classList.remove('dimmed'); }
  else { dimmedLines.add(lid); el.classList.add('dimmed'); }
  buildSVG();
}

/* ══════════════════════════════════════════════════════
   PAN / ZOOM
══════════════════════════════════════════════════════ */
const wrap = document.getElementById('map-wrap');

function applyTransform() {
  svg.style.transform = `translate(${tx}px,${ty}px) scale(${sc})`;
  document.getElementById('zoom-badge').textContent = Math.round(sc*100)+'%';
}

function clamp() {
  const ww = wrap.clientWidth, wh = wrap.clientHeight;
  const sw = SVG_W*sc, sh = SVG_H*sc;
  tx = Math.max(Math.min(0,ww-sw), Math.min(0,tx));
  ty = Math.max(Math.min(0,wh-sh), Math.min(0,ty));
}

function zoom(factor, cx, cy) {
  if(cx==null){cx=wrap.clientWidth/2;cy=wrap.clientHeight/2;}
  const newSc = Math.max(0.3, Math.min(6, sc*factor));
  tx = cx - (cx-tx)*(newSc/sc);
  ty = cy - (cy-ty)*(newSc/sc);
  sc = newSc;
  clamp(); applyTransform();
}

function resetView() {
  const ww=wrap.clientWidth, wh=wrap.clientHeight;
  sc = Math.min(ww/SVG_W, wh/SVG_H) * 0.85;
  tx = (ww - SVG_W*sc)/2;
  ty = (wh - SVG_H*sc)/2;
  applyTransform();
}

// Mouse drag
let drag=false, dx0, dy0, tx0, ty0;
wrap.addEventListener('mousedown', e => {
  if(e.target.tagName==='circle' && e.target.getAttribute('fill')==='transparent') return;
  drag=true; dx0=e.clientX; dy0=e.clientY; tx0=tx; ty0=ty;
});
window.addEventListener('mousemove', e => {
  if(!drag) return;
  tx=tx0+(e.clientX-dx0); ty=ty0+(e.clientY-dy0);
  clamp(); applyTransform();
});
window.addEventListener('mouseup', ()=>drag=false);
wrap.addEventListener('wheel', e => {
  e.preventDefault();
  const r=wrap.getBoundingClientRect();
  zoom(e.deltaY<0?1.12:1/1.12, e.clientX-r.left, e.clientY-r.top);
},{passive:false});

// Touch
let t1dist=0;
wrap.addEventListener('touchstart', e => {
  if(e.touches.length===1){drag=true;dx0=e.touches[0].clientX;dy0=e.touches[0].clientY;tx0=tx;ty0=ty;}
  else if(e.touches.length===2){drag=false;t1dist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}
},{passive:true});
wrap.addEventListener('touchmove', e => {
  if(e.touches.length===1&&drag){
    tx=tx0+(e.touches[0].clientX-dx0);ty=ty0+(e.touches[0].clientY-dy0);
    clamp();applyTransform();
  } else if(e.touches.length===2){
    e.preventDefault();
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    const r=wrap.getBoundingClientRect();
    const cx=(e.touches[0].clientX+e.touches[1].clientX)/2-r.left;
    const cy=(e.touches[0].clientY+e.touches[1].clientY)/2-r.top;
    zoom(d/t1dist,cx,cy); t1dist=d;
  }
},{passive:false});
wrap.addEventListener('touchend',()=>drag=false);

/* ══════════════════════════════════════════════════════
   TOOLTIP
══════════════════════════════════════════════════════ */
const tt = document.getElementById('tooltip');
function showTooltip(s, e) {
  document.getElementById('tt-name').textContent = s.name;
  const linesHtml = s.lines.map(lid => {
    const l = LINES[lid];
    return `<span class="tt-badge" style="background:${l.color}">${l.name}</span>`;
  }).join('');
  document.getElementById('tt-lines').innerHTML = linesHtml;
  const typeMap = {normal:'Haltestelle',terminus:'Endstation/Terminus',interchange:'Umsteigebahnhof',depot:'Depot'};
  document.getElementById('tt-type').textContent = typeMap[s.type]||s.type;
  const mgr = STATION_MANAGER[s.name];
  tt.style.borderColor = mgr && mgr !== 'LSB' ? managerColor(s) : '#252d3a';
  tt.style.left = e.clientX+'px';
  tt.style.top  = e.clientY+'px';
  tt.classList.add('show');
}
function hideTooltip(){ tt.classList.remove('show'); }

/* ══════════════════════════════════════════════════════
   STATION SHEET
══════════════════════════════════════════════════════ */
function openSheet(s) {
  document.getElementById('sheet-name').textContent = s.name;
  const linesHtml = s.lines.map(lid => {
    const l = LINES[lid];
    return `<span class="sheet-badge" style="background:${l.color}">${l.name}</span>`;
  }).join('');
  document.getElementById('sheet-lines').innerHTML = linesHtml;
  const typeMap = {normal:'Haltestelle',terminus:'Endstation · Terminus',interchange:'Umsteigeknoten',depot:'Betriebsdepot'};
  const mgr = STATION_MANAGER[s.name] || '—';
  const mgrColor = managerColor(s);
  document.getElementById('sheet-info').innerHTML =
    `${typeMap[s.type]||s.type} · ${s.lines.length} Linie(n) &nbsp;·&nbsp; ` +
    `<span style="color:${mgrColor};font-weight:800">▐ Managed by ${mgr}</span>`;
  document.getElementById('stn-sheet').style.borderTopColor = mgrColor;
  document.getElementById('stn-sheet').classList.add('open');
  document.getElementById('sheet-backdrop').classList.add('open');
}
function closeSheet() {
  document.getElementById('stn-sheet').classList.remove('open');
  document.getElementById('sheet-backdrop').classList.remove('open');
}

/* ══════════════════════════════════════════════════════
   TOGGLE CONTROLS
══════════════════════════════════════════════════════ */
function toggleLabels() {
  showLabels = !showLabels;
  document.getElementById('btn-labels').classList.toggle('active', showLabels);
  buildSVG();
}
function toggleDepots() {
  showDepots = !showDepots;
  document.getElementById('btn-depots').classList.toggle('active', showDepots);
  buildSVG();
}

/* ══════════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════════ */
document.fonts.ready.then(() => {
  buildSVG();
  buildLegend();
  resetView();
});
</script>
