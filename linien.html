<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GÜN Linienübersicht</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0e14;--surface:#13181f;--card:#1a2030;
  --border:#222a38;--text:#dde4f0;--dim:#5a6580;
}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;padding-bottom:60px;}

/* HEADER */
header{
  padding:28px 24px 20px;
  background:linear-gradient(160deg,#0d0f18 0%,#12151e 100%);
  border-bottom:1px solid var(--border);
  display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;
}
.logo{font-family:'Barlow',sans-serif;font-size:28px;font-weight:900;color:#fff;letter-spacing:.5px;}
.logo span{color:#ff0022;}
.header-right{margin-left:auto;text-align:right;}
.header-date{font-family:'DM Sans',sans-serif;font-size:11px;color:var(--dim);letter-spacing:1px;text-transform:uppercase;}
.header-title{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:800;color:#fff;letter-spacing:1px;text-transform:uppercase;}

/* FILTER BAR */
.filter-bar{
  display:flex;gap:6px;flex-wrap:wrap;
  padding:12px 24px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:50;
}
.fb{
  padding:5px 12px;border-radius:20px;
  border:1.5px solid var(--border);
  background:transparent;color:var(--dim);
  font-size:10px;font-weight:700;cursor:pointer;
  font-family:'DM Sans',sans-serif;transition:.12s;
}
.fb:hover{color:var(--text);border-color:#405060;}
.fb.on{color:#fff;border-color:var(--c,#fff);background:color-mix(in srgb,var(--c,#fff) 12%,transparent);}

/* CONTENT */
.content{max-width:860px;margin:0 auto;padding:28px 24px 0;}

/* SECTION HEADING */
.section-heading{
  display:flex;align-items:center;gap:12px;
  margin:28px 0 14px;
}
.sh-icon{
  width:32px;height:32px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;flex-shrink:0;
}
.sh-title{font-family:'Barlow',sans-serif;font-size:13px;font-weight:900;
  text-transform:uppercase;letter-spacing:2px;color:var(--dim);}
.sh-line{flex:1;height:1px;background:var(--border);}

/* LINE CARD */
.line-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:14px;margin-bottom:12px;overflow:hidden;
  transition:border-color .15s;
}
.line-card:hover{border-color:#354060;}
.line-card.hidden{display:none;}

/* Card top accent */
.lc-bar{height:3px;}

/* Card header */
.lc-head{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px 10px;
}
.lc-badge{
  font-family:'Barlow',sans-serif;font-size:18px;font-weight:900;
  color:#fff;padding:5px 12px;border-radius:8px;
  flex-shrink:0;letter-spacing:.5px;min-width:60px;text-align:center;
}
.lc-route{
  font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:800;
  color:#fff;letter-spacing:.3px;
}
.lc-type{
  margin-left:auto;font-size:9px;font-weight:700;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--dim);flex-shrink:0;
}

/* Station row */
.lc-stations{
  padding:0 16px 14px;
  display:flex;align-items:center;
  flex-wrap:wrap;gap:0;
  position:relative;
}
.stn{
  display:flex;flex-direction:column;align-items:center;
  position:relative;
  flex-shrink:0;
}
.stn-dot{
  width:10px;height:10px;border-radius:50%;
  border:2px solid #fff;background:var(--card);
  flex-shrink:0;
  position:relative;z-index:2;
}
.stn-dot.terminus{
  width:12px;height:12px;border-width:2.5px;
}
.stn-dot.interchange{
  width:13px;height:13px;border-width:2.5px;
  background:#fff;
}
.stn-name{
  font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;
  color:var(--text);letter-spacing:.3px;
  margin-top:5px;text-align:center;max-width:72px;line-height:1.2;
  white-space:normal;
}
.stn-name.terminus-name{font-weight:900;color:#fff;}
.stn-connector{
  height:3px;flex:1;min-width:8px;max-width:36px;
  position:relative;top:-18px;
  border-radius:1.5px;
}
/* interchange marker */
.stn-xfer{
  font-size:7px;font-weight:700;letter-spacing:.5px;
  color:var(--dim);margin-top:2px;text-align:center;
  max-width:72px;
}
</style>

═══════════════════════════════════════════ */
const GROUPS = [
  { label:'🚄 Hochbahn',       icon:'🚄', iconBg:'#012d5e22', ids:['L14','L15','L16','L17'] },
  { label:'🚆 S-Bahn',         icon:'🚆', iconBg:'#7b000022', ids:['S11','S12','S20','S20a','S22','S23','S24'] },

function buildFilters() {
  const bar = document.getElementById('filter-bar');
  LINES_ALL.forEach(l => {
    const btn = document.createElement('button');
    btn.className = 'fb';
    btn.dataset.f = l.id;
    btn.textContent = l.id;
    btn.style.setProperty('--c', l.color);
    btn.onclick = () => filt(l.id, btn);
    bar.appendChild(btn);
  });
}

function buildContent() {
  const cont = document.getElementById('content');
  cont.innerHTML = '';

  GROUPS.forEach(grp => {
    const secHead = document.createElement('div');
    secHead.className = 'section-heading';
    secHead.dataset.group = grp.ids.join(' ');
    secHead.innerHTML = `
      <div class="sh-icon" style="background:${grp.iconBg};border:1px solid rgba(255,255,255,.08)">${grp.icon}</div>
      <div class="sh-title">${grp.label}</div>
      <div class="sh-line"></div>`;
    cont.appendChild(secHead);

    grp.ids.forEach(lid => {
      const l = LINES_ALL.find(x => x.id === lid);
      if (!l) return;

      const card = document.createElement('div');
      card.className = 'line-card';
      card.dataset.lid = lid;

      // Build stations HTML
      let stationsHtml = '';
      l.stops.forEach((s, i) => {
        const isFirst = i === 0, isLast = i === l.stops.length - 1;
        const dotClass = s.terminus ? 'stn-dot terminus' : s.xfer.length ? 'stn-dot interchange' : 'stn-dot';
        const nameClass = s.terminus ? 'stn-name terminus-name' : 'stn-name';
        const xferHtml = s.xfer.length
          ? `<div class="stn-xfer">${s.xfer.join(' ')}</div>`
          : '';

        stationsHtml += `<div class="stn">
          <div class="${dotClass}" style="border-color:${l.color};${s.xfer.length ? `background:${l.color}` : ''}"></div>
          <div class="${nameClass}">${s.name}</div>
          ${xferHtml}
        </div>`;

        if (!isLast) {
          stationsHtml += `<div class="stn-connector" style="background:${l.color}"></div>`;
        }
      });

      card.innerHTML = `
        <div class="lc-bar" style="background:${l.color}"></div>
        <div class="lc-head">
          <div class="lc-badge" style="background:${l.color}">${l.id}</div>
          <div class="lc-route">${l.route}</div>
          <div class="lc-type">${l.type}</div>
        </div>
        <div class="lc-stations">${stationsHtml}</div>`;

      cont.appendChild(card);
    });
  });
}

function filt(f, btn) {
  document.querySelectorAll('.fb').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');

  document.querySelectorAll('.line-card').forEach(c => {
    c.classList.toggle('hidden', f !== 'ALL' && c.dataset.lid !== f);
  });

  // Section headings
  document.querySelectorAll('.section-heading').forEach(h => {
    const ids = h.dataset.group.split(' ');
    const anyVis = f === 'ALL' || ids.includes(f);
    h.style.display = anyVis ? '' : 'none';
  });
}

buildFilters();
buildContent();
